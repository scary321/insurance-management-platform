# Render Blueprint — deploys the Flask API and a managed PostgreSQL database.
# In Render: New + > Blueprint, point at this repo, then set CORS_ORIGINS to your
# deployed frontend URL once Vercel is live.

databases:
  - name: insurance-db
    databaseName: insurance_db
    user: insurance
    plan: free

services:
  - type: web
    name: insurance-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python init_db.py
    startCommand: gunicorn wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insurance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.4
      # Set this to your Vercel URL after the frontend is deployed:
      - key: CORS_ORIGINS
        sync: false
